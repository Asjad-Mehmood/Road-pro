name: Build RoadPro setup

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # publishing a release on github.com (tag vX.Y.Z) builds and attaches the setup
  release:
    types: [published]

# one build per branch / tag at a time (a release can start two: tag push + release)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version.txt must look like 1.0.0 (found '$v')" }
          [xml]$pc = Get-Content plugin/RoadPro.bundle/PackageContents.xml
          $pv = $pc.ApplicationPackage.AppVersion
          "version=$v" >> $env:GITHUB_OUTPUT
          "plugin=$pv" >> $env:GITHUB_OUTPUT
          Write-Host "RoadPro release $v, AutoCAD plugin $pv"

      - name: Check versions match
        shell: pwsh
        run: |
          # release version (version.txt) = setup + Hub; the plugin has its own version:
          # PackageContents.xml AppVersion, ComponentEntry Version and *rp:ver* must agree
          $v = '${{ steps.ver.outputs.version }}'; $pv = '${{ steps.ver.outputs.plugin }}'
          [xml]$pc = Get-Content plugin/RoadPro.bundle/PackageContents.xml
          $ce = $pc.ApplicationPackage.Components.ComponentEntry.Version
          if ($ce -ne $pv) { throw "PackageContents.xml ComponentEntry Version is $ce, AppVersion is $pv" }
          $lsp = Get-Content plugin/RoadPro.bundle/Contents/RoadPro.lsp -Raw
          $short = ($pv -replace '\.0$', '')
          if ($lsp -notmatch ('\(setq \*rp:ver\* "' + [regex]::Escape($short) + '"\)')) { throw "RoadPro.lsp *rp:ver* is not $short (PackageContents.xml says $pv)" }
          if (-not (Test-Path ("docs/" + [IO.Path]::GetFileName($pc.ApplicationPackage.HelpFile)))) { throw "HelpFile $($pc.ApplicationPackage.HelpFile) is not in docs/" }
          if ("${{ github.ref }}" -like "refs/tags/v*" -and "${{ github.ref_name }}" -ne "v$v") { throw "Tag ${{ github.ref_name }} does not match version.txt ($v)" }
          Write-Host "Release $v, plugin $pv - versions consistent"

      - name: Unit tests
        run: dotnet test hub/tests/RoadPro.Hub.Core.Tests/RoadPro.Hub.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build RoadPro Hub
        run: dotnet publish hub/src/RoadPro.Hub/RoadPro.Hub.csproj -c Release -o build/hub -p:Version=${{ steps.ver.outputs.version }}

      - name: Smoke test (install / uninstall the plugin from the command line)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/hub/payload | Out-Null
          Copy-Item -Recurse -Force plugin/RoadPro.bundle build/hub/payload/
          $target = Join-Path $env:APPDATA 'Autodesk\ApplicationPlugins\RoadPro.bundle'
          $p = Start-Process build/hub/RoadProHub.exe -ArgumentList '/installplugin','/quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$target\Contents\RoadPro.lsp")) { Get-Content "$env:LOCALAPPDATA\RoadPro Hub\logs\RoadProHub.log" -ErrorAction SilentlyContinue; throw "install failed ($($p.ExitCode))" }
          $p = Start-Process build/hub/RoadProHub.exe -ArgumentList '/uninstallplugin','/quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $target)) { throw "uninstall failed ($($p.ExitCode))" }
          Remove-Item -Recurse -Force build/hub/payload
          Get-Content "$env:LOCALAPPDATA\RoadPro Hub\logs\RoadProHub.log"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }

      - name: Build setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer/RoadProHub.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem installer/Output

      - name: Build a test "next version" setup (for the update test)
        id: next
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'; $p = $v.Split('.')
          $n = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          $q = '${{ steps.ver.outputs.plugin }}'.Split('.')
          $pn = "$($q[0]).$($q[1]).$([int]$q[2] + 1)"
          "version=$n" >> $env:GITHUB_OUTPUT
          "plugin=$pn" >> $env:GITHUB_OUTPUT
          dotnet publish hub/src/RoadPro.Hub/RoadPro.Hub.csproj -c Release -o build/hub -p:Version=$n
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          $pc = 'plugin/RoadPro.bundle/PackageContents.xml'
          (Get-Content $pc -Raw) -replace 'AppVersion="[^"]+"', "AppVersion=""$pn""" | Set-Content $pc -NoNewline
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$n" "/O$PWD\test-next" installer/RoadProHub.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          git checkout -- plugin
          Get-ChildItem test-next

      - name: Guide screenshots (setup wizard and Hub, clean PC)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Win2 { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            public struct RECT { public int L, T, R, B; } }
          "@
          function ShotH($h, $file) {
            if (-not $h -or $h -eq [IntPtr]::Zero) { Write-Host "no window for $file"; return }
            [Win2]::SetForegroundWindow($h) | Out-Null; Start-Sleep -Milliseconds 800
            $r = New-Object Win2+RECT; [Win2]::GetWindowRect($h, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ([Math]::Max(100, $r.R - $r.L)), ([Math]::Max(100, $r.B - $r.T))
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("screenshots/$file", [System.Drawing.Imaging.ImageFormat]::Png); Write-Host "saved $file"
          }
          function Wiz { Get-Process | Where-Object { $_.MainWindowTitle -like 'Setup - RoadPro*' } | Select-Object -First 1 }
          $v = '${{ steps.ver.outputs.version }}'
          $setupV = Get-ChildItem installer/Output/*.exe | Select-Object -First 1
          # the Hub opened at the end should show "up to date": local feed for this same version
          New-Item -ItemType Directory -Force test-cur | Out-Null
          $hash = (Get-FileHash $setupV.FullName -Algorithm SHA256).Hash.ToLower()
          $m = [ordered]@{ version = $v; released = (Get-Date -Format 'yyyy-MM-dd'); setupUrl = ([Uri]$setupV.FullName).AbsoluteUri; sha256 = $hash; size = $setupV.Length; notes = "RoadPro $v" }
          $m | ConvertTo-Json | Set-Content test-cur/update.json -Encoding utf8
          $env:ROADPRO_UPDATE_MANIFEST = ([Uri](Resolve-Path test-cur/update.json).Path).AbsoluteUri
          $ws = New-Object -ComObject WScript.Shell
          Start-Process $setupV.FullName | Out-Null
          for ($i = 0; $i -lt 40 -and -not (Wiz); $i++) { Start-Sleep 1 }
          Start-Sleep 2; $w = Wiz
          ShotH $w.MainWindowHandle 'Setup_1_licence.png'
          $ws.AppActivate($w.Id) | Out-Null; Start-Sleep 1; $ws.SendKeys('%a'); Start-Sleep 1; $ws.SendKeys('{ENTER}'); Start-Sleep 2
          ShotH (Wiz).MainWindowHandle 'Setup_2_folder.png'
          $ws.SendKeys('{ENTER}'); Start-Sleep 2
          ShotH (Wiz).MainWindowHandle 'Setup_3_tasks.png'
          $ws.SendKeys('{ENTER}'); Start-Sleep 2
          ShotH (Wiz).MainWindowHandle 'Setup_4_ready.png'
          $ws.SendKeys('{ENTER}'); Start-Sleep 25
          ShotH (Wiz).MainWindowHandle 'Setup_5_finished.png'
          $ws.SendKeys('{ENTER}')
          for ($i = 0; $i -lt 30 -and -not (Get-Process RoadProHub -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0); $i++) { Start-Sleep 1 }
          Start-Sleep 8
          $hub = Get-Process RoadProHub -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1
          if ($hub) { ShotH $hub.MainWindowHandle 'RoadProHub_main.png'; Stop-Process -Id $hub.Id -Force }
          # leave a clean PC for the next step
          $app = Join-Path $env:LOCALAPPDATA 'Programs\RoadPro Hub'
          $un = Get-ChildItem "$app\unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait }
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\RoadProHub.exe"); $i++) { Start-Sleep 1 }
          Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA 'RoadPro Hub') -ErrorAction SilentlyContinue
          Remove-Item Env:\ROADPRO_UPDATE_MANIFEST

      - name: Test setup, automatic update and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.ver.outputs.version }}'; $n = '${{ steps.next.outputs.version }}'
          $pv = '${{ steps.ver.outputs.plugin }}'; $pn = '${{ steps.next.outputs.plugin }}'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\RoadPro Hub'
          $hubExe = "$app\RoadProHub.exe"
          $target = Join-Path $env:APPDATA 'Autodesk\ApplicationPlugins\RoadPro.bundle'
          $data = Join-Path $env:LOCALAPPDATA 'RoadPro Hub'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          function Fail($m) { Get-Content "$data\logs\RoadProHub.log" -ErrorAction SilentlyContinue | Select-Object -Last 40; throw $m }
          function PluginVersion { ([xml](Get-Content "$target\PackageContents.xml")).ApplicationPackage.AppVersion }
          function HubVersion { (Get-Item $hubExe).VersionInfo.FileVersion }
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Win { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            public struct RECT { public int L, T, R, B; } }
          "@
          function Shot($proc, $file) {
            $proc.Refresh(); $h = $proc.MainWindowHandle
            if ($h -eq [IntPtr]::Zero) { Write-Host "no window for $file"; return }
            [Win]::SetForegroundWindow($h) | Out-Null; Start-Sleep -Seconds 1
            $r = New-Object Win+RECT; [Win]::GetWindowRect($h, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ([Math]::Max(100, $r.R - $r.L)), ([Math]::Max(100, $r.B - $r.T))
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("screenshots/$file", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          function Manifest($ver, $setup, $hash, $file) {
            $m = [ordered]@{ version = $ver; released = (Get-Date -Format 'yyyy-MM-dd'); setupUrl = ([Uri](Resolve-Path $setup).Path).AbsoluteUri
                             sha256 = $hash; size = (Get-Item $setup).Length; notes = "Test release $ver" }
            $m | ConvertTo-Json | Set-Content $file -Encoding utf8
            return ([Uri](Resolve-Path $file).Path).AbsoluteUri
          }

          # 1. install version V silently (default tasks: plugin + start-up check)
          $setupV = Get-ChildItem installer/Output/*.exe | Select-Object -First 1
          $p = Start-Process $setupV.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup failed ($($p.ExitCode))" }
          foreach ($f in $hubExe, "$app\payload\RoadPro.bundle\PackageContents.xml", "$target\Contents\RoadPro.lsp", "$target\Contents\Docs") {
            if (-not (Test-Path $f)) { Get-Content setup.log; throw "missing after setup: $f" }
          }
          if ((PluginVersion) -ne $pv) { Fail "plugin version $(PluginVersion), expected $pv" }
          $run = (Get-ItemProperty $runKey -Name 'RoadPro Hub' -ErrorAction SilentlyContinue).'RoadPro Hub'
          if ($run -notlike '*/checkupdates*') { Fail "start-up check not registered" }
          Write-Host "Installed $v (plugin $pv); start-up check: $run"

          # 2. screenshot: main window with an update waiting
          $nextSetup = Get-ChildItem test-next/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $nextSetup.FullName -Algorithm SHA256).Hash.ToLower()
          $manifest = Manifest $n $nextSetup.FullName $hash "$PWD\test-next\update.json"
          $env:ROADPRO_UPDATE_MANIFEST = $manifest
          $hub = Start-Process $hubExe -PassThru; Start-Sleep -Seconds 10
          Shot $hub 'RoadProHub_update_available.png'; Stop-Process -Id $hub.Id -Force
          # the Windows start-up prompt (first check of the day)
          Remove-Item "$data\update-state.json" -ErrorAction SilentlyContinue
          $hub = Start-Process $hubExe -ArgumentList '/checkupdates' -PassThru; Start-Sleep -Seconds 30
          Shot $hub 'RoadProHub_startup_prompt.png'
          if (-not $hub.HasExited) { Stop-Process -Id $hub.Id -Force } else { Fail "start-up check did not show the prompt" }
          $notice = Get-Content "$data\update-available.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($notice -ne ($n -replace '\.0$', '')) { Fail "update-available.txt says '$notice', expected $n" }
          Remove-Item Env:\ROADPRO_UPDATE_MANIFEST

          # 3. a tampered update must be refused
          $bad = Manifest $n $nextSetup.FullName ('0' * 64) "$PWD\test-next\bad.json"
          $p = Start-Process $hubExe -ArgumentList '/autoupdate', "/manifest=$bad" -Wait -PassThru
          if ($p.ExitCode -eq 0) { Fail "tampered update was accepted" }
          if ((HubVersion) -notlike "$v*") { Fail "version changed after a refused update" }
          Write-Host "Tampered update refused (exit $($p.ExitCode))"

          # 4. real update V -> N through the Hub
          $p = Start-Process $hubExe -ArgumentList '/autoupdate', "/manifest=$manifest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "autoupdate failed ($($p.ExitCode))" }
          for ($i = 0; $i -lt 180; $i++) {
            if ((HubVersion) -like "$n*" -and -not (Get-Process -Name 'RoadPro_Setup_*' -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          if ((HubVersion) -notlike "$n*") { Get-Content "$data\updates\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; Fail "Hub is $(HubVersion) after the update, expected $n" }
          if ((PluginVersion) -ne $pn) { Fail "plugin is $(PluginVersion) after the update, expected $pn" }
          if (-not (Get-ChildItem "$data\backup" -Directory | Where-Object Name -like "RoadPro.bundle_$pv*")) { Fail "no backup of plugin $pv kept" }
          Write-Host "Updated $v -> $n (Hub) and plugin $pv -> $pn, backup of $pv kept"

          # 5. uninstall: Hub, plugin and start-up check removed
          $un = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait | Out-Null
          for ($i = 0; $i -lt 60 -and ((Test-Path $target) -or (Test-Path $hubExe)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $target) { Fail "plugin still installed after uninstall" }
          if (Test-Path $hubExe) { Fail "Hub still installed after uninstall" }
          if ((Get-ItemProperty $runKey -Name 'RoadPro Hub' -ErrorAction SilentlyContinue)) { Fail "start-up check still registered" }
          Write-Host "Setup, update and uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: RoadPro_Setup_v${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Write update.json (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $setup = Get-Item "installer/Output/RoadPro_Setup_v$v.exe"
          $notes = (Get-Content "docs/RoadPro_WhatsNew.txt" -Raw)
          $m = [ordered]@{
            version   = $v
            released  = (Get-Date -Format 'yyyy-MM-dd')
            setupUrl  = "https://github.com/${{ github.repository }}/releases/download/v$v/$($setup.Name)"
            sha256    = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
            size      = $setup.Length
            notes     = "See what is new in RoadPro $v."
            notesUrl  = "https://github.com/${{ github.repository }}/releases/tag/v$v"
          }
          $m | ConvertTo-Json | Set-Content installer/Output/update.json -Encoding utf8
          Get-Content installer/Output/update.json
          # fixed name for website links: .../releases/latest/download/RoadPro_Setup.exe
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $setup.FullName release/RoadPro_Setup.exe
          Copy-Item $setup.FullName release/
          Copy-Item installer/Output/update.json release/
          $repo = "https://github.com/${{ github.repository }}"
          $body = @(
            "## RoadPro $v - Road builder for AutoCAD and Civil 3D (plugin v${{ steps.ver.outputs.plugin }})",
            "",
            "**Download:** [RoadPro_Setup_v$v.exe]($repo/releases/download/v$v/$($setup.Name)) - run it, no administrator rights needed.",
            "It installs **RoadPro Hub** and the AutoCAD plugin, and replaces any older RoadPro.",
            "",
            "Works with AutoCAD 2013 or newer, Civil 3D, Map 3D (not AutoCAD LT), Windows 10 / 11.",
            "If Windows shows *Windows protected your PC*, click **More info -> Run anyway**.",
            "",
            "SHA-256: ``$($m.sha256)``",
            "",
            '```text',
            $notes.TrimEnd(),
            '```',
            "",
            "Developed by [www.exceltokml.com](https://www.exceltokml.com/)"
          ) -join "`n"
          Set-Content release/notes.md $body -Encoding utf8

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RoadPro ${{ steps.ver.outputs.version }}
          body_path: release/notes.md
          make_latest: true
          files: |
            release/*.exe
            release/update.json
